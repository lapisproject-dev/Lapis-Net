[versions]
kotlin = "2.4.20"
ktlint-gradle = "14.2.0"
slf4j = "2.0.19"
kotlin-logging = "8.0.4"
kotest = "6.2.4"
logback = "1.5.38"
secp256k1-kmp = "0.24.0"
bouncycastle = "1.85.2"
# jvm-libp2p and nabu: NOT bumped in the 2026-09-08 dependency-maintenance wave. A newer
# jvm-libp2p release (1.3.6-RELEASE) exists on Cloudsmith, and nabu v0.8.1 is a real GitHub tag
# (pure patch bump from v0.8.0), but nabu is consumed via JitPack (com.github.peergos:nabu) and
# JitPack's own build for the v0.8.1 tag is broken (build status "Error" per
# https://jitpack.io/api/builds/com.github.peergos/nabu - v0.8.0 is "ok", v0.8.1 is "Error"), so
# the artifact is unresolvable (404 on nabu-v0.8.1.pom) regardless of source compatibility.
# Staying on the last known-good pair. See lapis-net-storage/build.gradle.kts's header comment
# for the underlying fragile-cross-jar-fork situation this pairing has to respect whenever it is
# revisited.
#
# Re-checked in V0.9.8 (2026-09-08), when v0.8.1 was the leading hypothesis for the long-standing
# cross-node DHT provider-discovery defect - its commits do touch exactly that area ("Tolerate
# multiaddrs we can't parse in handling kademlia responses", "Make sure we close connections in
# kademlia after queries", changes to Kademlia.java/KademliaEngine.java/PeerAddresses.java).
# Findings: (a) JitPack's v0.8.1 build still fails to compile (Maven compile failure dated
# 2026-07-03) and the artifact is still a 404, with no Maven Central fallback and no newer
# JitPack-buildable commit - the only "ok" non-tag commits predate v0.8.0; and (b) the bump would
# not have helped anyway - the defect was root-caused to this project's own Host/address-book
# wiring plus an on-event-loop write in Nabu's provideBlock, neither of which v0.8.1 touches, and
# both are now fixed inside lapis-net-storage against v0.8.0. See docs/architecture.adoc,
# "Cross-node DHT provider discovery". No dependency coordinate changed in that repair, so the
# fork-exclusion/bytecode-compatibility verification recorded below still stands unmodified.
jvm-libp2p = "1.3.5-RELEASE"
# Netty's protobuf codec. jvm-libp2p already pulls this in, but only at *runtime* scope, so the
# classes are present when the process runs and absent when this project compiles. That is fine for
# jvm-libp2p's own (precompiled) circuit-relay handlers and not fine for
# lapis-net-networking/relay/CircuitRelayProtocols.kt, which has to strip those very codecs off a
# stream when a relay control stream becomes a raw byte pipe. Declared explicitly, pinned to the
# version jvm-libp2p:1.3.5-RELEASE itself resolves (verified via the runtimeClasspath report) so the
# compile and runtime classpaths cannot drift apart - re-check when jvm-libp2p is next bumped.
netty = "4.2.10.Final"
nabu = "v0.8.0"
java-cid = "v1.3.10"
ktor = "3.5.2"
kotlinx-serialization-json = "1.11.0"
electrum-client = "0.3.0"
bitcoin-kmp = "0.31.0"
zxing = "3.5.4"
# Plan's originally-specified 1.13.0 does not exist on Maven Central (verified: the highest
# published fr.acinq.lightning:lightning-kmp-jvm version is 1.8.4) - using the real latest
# release instead. See lapis-net-virtus/build.gradle.kts's header comment for the version-skew
# note on this artifact's own bitcoin-kmp/secp256k1-kmp transitive dependency pins.
lightning-kmp = "1.8.4"
# V0.9.3 - pure-Java headless browser (executes real JS/DOM, no native browser binary), added
# test-only to lapis-net-browser so MailXssRenderingTest.kt can prove mail.js's rendering function
# actually escapes an injected <script>/onerror payload, not just describe the intent. Bumped
# 5.3.0 -> 5.5.0 during the 2026-09-08 dependency-maintenance wave; verified current on Maven
# Central via maven-metadata.xml at that time - re-verify at a later implementation time, versions drift.
htmlunit = "5.5.0"
# V0.8.7 - libwebrtc JNI bindings (Apache-2.0; gebundeltes libwebrtc BSD-3), used exclusively by
# lapis-net-call/WebRtcCallMediaEngine.kt. Bytecode target Java 8, verified runnable on JDK 25
# (Temurin 25.0.4) via an executable probe on 2026-09-02 - two RTCPeerConnections in one JVM process,
# HeadlessAudioDeviceModule, zero ICE servers, RESULT connected=true. Native classifier jars are
# ~25 MB each - only the host platform's classifier is resolved, see
# lapis-net-call/build.gradle.kts's own webrtcNativeClassifier() function. Verified current on Maven
# Central as of this wave (2026-09-02) via maven-metadata.xml - versions drift, re-verify later.
webrtc-java = "0.16.0"

